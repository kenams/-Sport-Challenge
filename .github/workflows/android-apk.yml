name: Android APK

on:
  push:
    branches:
      - codex/immortal-apk-build
      - codex/immortal-polish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://sjnlilbsqecznpxbqukw.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqbmxpbGJzcWVjem5weGJxdWt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0ODg2MDksImV4cCI6MjA3OTA2NDYwOX0.q2-e3zRiXWDHVdj8mQoH036D7qgCgG6PuiV0hrvfIKU
      EXPO_PUBLIC_WEB_BASE_URL: https://immortal-arena.vercel.app
      EXPO_PUBLIC_DEMO_MODE: "false"
      EXPO_PUBLIC_SIMPLE_MODE: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build release APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: immortal-arena-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
